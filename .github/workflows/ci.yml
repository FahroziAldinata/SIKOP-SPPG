name: CI

on:
  push:
    branches: [main, ci-test]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  node-check:
    name: Node syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: node --check semua backend/src
        run: |
          cd backend
          find src -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

  test-backend:
    name: Backend tests (Vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sppg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sppg?schema=public
      TEST_PASSWORD: ganti-password-ini
      JWT_SECRET: ci-test-secret-untuk-github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: cd backend && npm ci
      - name: Migrate
        run: cd backend && npx prisma migrate deploy
      - name: Seed
        run: cd backend && npx prisma db seed
      - name: Install Google Chrome (untuk PDF tests)
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
          google-chrome --version
      - name: Test (log disimpan)
        id: tests
        run: |
          cd backend
          npm test > /tmp/vitest.log 2>&1 || true
          cat /tmp/vitest.log
      - name: Diagnose DB (jika gagal)
        if: failure()
        run: |
          cd backend
          node -e '
            const { PrismaClient } = require("@prisma/client");
            const p = new PrismaClient();
            (async () => {
              const pers = await p.periode.findMany({ orderBy: { tanggalMulai: "desc" } });
              const lines = ["=== DIAG PERIODE (desc) ==="];
              for (const x of pers) {
                const menu = await p.menuHarian.count({ where: { periodeId: x.id } });
                const angg = await p.anggaranHarian.count({ where: { periodeId: x.id } });
                lines.push(`periode ${x.id} | mulai=${x.tanggalMulai.toISOString()} selesai=${x.tanggalSelesai.toISOString()} | menu=${menu} anggaran=${anggar}`);
              }
              const mu = await p.menuHarian.findMany({ orderBy: { tanggal: "asc" }, take: 5 });
              for (const m of mu) lines.push(`MENU sample: ${m.id} periode=${m.periodeId} tanggal=${m.tanggal.toISOString()} status=${m.status}`);
              require("fs").writeFileSync("/tmp/diag.txt", lines.join("\n"));
              await p.$disconnect();
            })().catch(async (e) => {
              require("fs").writeFileSync("/tmp/diag.txt", "DIAG ERROR: " + e.message);
              await p.$disconnect();
            });
          '
          cat /tmp/diag.txt >> /tmp/vitest.log
          cat /tmp/vitest.log | tail -80
      - name: Post debug ke GitHub issue (public)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/vitest.log')
              ? fs.readFileSync('/tmp/vitest.log', 'utf8').slice(-30000)
              : '(no log)';
            const sha = context.sha.slice(0, 8);
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI test-backend debug ${sha}`,
              body: `**Run:** ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${log}\n\`\`\``,
            });
            core.notice(`Debug issue created: #${issue.number}`);

  lint-fe:
    name: Lint Frontend (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint

  lint-be:
    name: Lint Backend (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: cd backend && npm ci
      - name: Lint
        run: cd backend && npx oxlint src

  build-fe:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build